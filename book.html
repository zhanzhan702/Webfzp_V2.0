<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教材</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="textbooks">
        <h2>教材</h2>
        <div class="course-grid">
            <div class="course-card">
                <div class="course-name">计算机组成原理</div>
                <div class="course-images">
                    <figure>
                        <figcaption class="course-type">教材</figcaption>
                        <img src="images/computer.jpg" alt="计算机组成原理" width="200" height="300">
                    </figure>
                    <figure>
                        <figcaption>参考书</figcaption>
                        <img src="images/computer2.jpg" alt="现代计算机组成原理" width="200" height="300">
                        <img src="images/computer3.jpg" alt="计算机组成原理教程" width="200" height="300">
                    </figure>
                </div>
            </div>
            <div class="course-card">
                <div class="course-name">数据库原理与应用</div>
                <div class="course-images">
                    <figure>
                        <figcaption>教材</figcaption>
                        <img src="images/database.jpg" alt="数据库原理与应用" width="200" height="300">
                    </figure>
                </div>
            </div>
            <div class="course-card">
                <div class="course-name">离散数学</div>
                <div class="course-images">
                    <figure>
                        <figcaption>教材</figcaption>
                        <img src="images/DiscreteMath.jpg" alt="离散数学" width="200" height="300">
                    </figure>
                </div>
            </div>
            <div class="course-card">
                <div class="course-name">Java</div>
                <div class="course-images">
                    <figure>
                        <figcaption>教材</figcaption>
                        <img src="images/Java.jpg" alt="Java" width="200" height="300">
                    </figure>
                </div>
            </div>
            <div class="course-card">
                <div class="course-name">Web</div>
                <div class="course-images">
                    <figure>
                        <figcaption>教材</figcaption>
                        <img src="images/web.jpg" alt="web" width="200" height="300">
                    </figure>
                </div>
            </div>
            <div class="course-card">
                <div class="course-name">Web2</div>
                <div class="course-images">
                    <figure>
                        <figcaption>教材</figcaption>
                        <img src="images/Web2.jpg" alt="Web2" width="200" height="300">
                    </figure>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
