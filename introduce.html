<h2 id="course-introduction">课程简介</h2>
    
    <p>
        <span>
            <big>本</big>课程是软件工程专业的一门专业必修课。通过对Web前端三大主流开发技术学习、 探究和实践，让学生理解和掌握<em>HTML5、CSS3、JavaScript</em> 等脚本语言的相关知识， 通过项目实战和训练培养学生开发和设计Web网站或网页的基本操作技能和工作岗位适应能力。 
        </span>
    </p>
    <p>
        <span>
            <big>通</big>过本课程的学习，使学生理解和掌握HTML（超文本标记语言） 中各种常用标记的使用；CSS（层叠样式表）常用属性的使用， 如何运用div+CSS对网页进行布局； <span class="code">JavaScript</span> 脚本语言的基础知识， 以及借助于<span class="code">JavaScript</span>语言的强大功能增强网页功能，实现用户交互事件等动态网页功能， 为后续课程奠定学习基础。
        </span>
    </p>
